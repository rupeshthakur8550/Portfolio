<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/resume.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Frontend engineer portfolio for Rupesh Thakur, covering product engineering, full-stack delivery, projects, blogs, and contact details." />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("theme");
        var theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <title>Rupesh Thakur | Frontend Engineer</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
